<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/img/logo-icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/game.css">
    <link rel="stylesheet" href="css/style.css">
    <title>Typovel</title>
</head>
<body>
    <header>
        <nav>
            <a href="/" class="logo"><img src="assets/img/logo-icon.svg" class="logo-icon" alt="Typovel Logo"><span>TYPOVEL</span></a>
            <div class="left">
                <a href="wip.html" class="nav-link"><span>Classement</span></a>
                <a href="wip.html" class="nav-link"><span>Guide</span></a>
            </div>
            <div class="right">
                <a href="wip.html" class="login nav-link"><span>Se connecter</span></a>
                <a href="wip.html" class="register nav-link"><span>S'inscrire</span></a>
            </div>
            <div class="menu">
                <i class="fa-solid fa-bars bouton"></i>
                <div class="close nav-menu">
                    <div class=login-section>
                        <a href="wip.html" class=register><span>S'inscrire</span></a>
                        <a href="wip.html" class="login"><span >Se connecter</span></a>
                    </div>
                    <div class="other">
                        <a href="wip.html"><span>Classement</span></a>
                        <a href="wip.html"><span>Guide</span></a>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <div class="TypingArea">
            <input type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="typing-input">
            
            <div class="game-container">
                <span class="timer">0</span>
                
                <div class="jeu">
                    
                </div>
                <div class="caret"></div>
                <div class="focusWarning hidden">
                    <span>Veuillez appuyer sur une touche ou cliquer dans la zone pour revenir au jeu</span>
                </div>
            </div>

            <div class="gameover-container hidden">
                <div id="stats-wrapper">
                    <div class="stats" id="wpm-container">
                        <span class="stat-label">wpm</span>
                        <span class="stat-value" id="wpm-score">150</span>
                    </div>
                    <div id="other-wrapper">
                        <div class="stats" id="acc-container">
                            <span class="stat-label">précision</span>
                            <span class="stat-value" id="acc-score">0%</span>
                        </div>
                        <div class="stats" id="time-container">
                            <span class="stat-label">temps</span>
                            <span class="stat-value" id="time-score">0s</span>
                        </div>
                        <div class="stats" id="mistakes-container">
                            <span class="stat-label">erreurs</span>
                            <span class="stat-value" id="mistakes-score">0</span>
                        </div>
                    </div>
                </div>
                <div class="replay">
                    <span>Rejouer</span>
                    <i class="fa-solid fa-repeat"></i>
                </div>
            </div>
            
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
